name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      V4EX_storePassword: ${{ secrets.V4EX_STORE_PASSWORD }}
      V4EX_keyAlias: ${{ secrets.V4EX_KEY_ALIAS }}
      V4EX_keyPassword: ${{ secrets.V4EX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure release signing path
        run: echo "V4EX_storeFile=$RUNNER_TEMP/v4ex-release.jks" >> "$GITHUB_ENV"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.V4EX_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 V4EX_storePassword V4EX_keyAlias V4EX_keyPassword; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name (see README release instructions)"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$V4EX_storeFile"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Test and build signed release
        run: bash ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify APK and generate versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          gh release view "$RELEASE_TAG" --json body > "$RUNNER_TEMP/release.json"
          python3 scripts/prepare_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --metadata app/build/outputs/apk/release/output-metadata.json \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --tag "$RELEASE_TAG" --repository "$GH_REPO" \
            --release "$RUNNER_TEMP/release.json" --destination dist

      - name: Upload APK before publishing update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.apk dist/*.apk.sha256 --clobber
          gh release upload "$RELEASE_TAG" dist/update.json --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$V4EX_storeFile"
